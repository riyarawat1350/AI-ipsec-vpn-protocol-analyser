services:
  # ── Local MongoDB (Option A: no Atlas needed) ────────────────────────────────
  mongo:
    image: mongo:7
    container_name: ipsecscope-mongo
    restart: unless-stopped
    ports:
      - "27017:27017"          # localhost:27017 — do NOT expose in production
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: ipsecscope-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data
    environment:
      - HOST=0.0.0.0
      - PORT=8000
      # MongoDB URL — override with MONGODB_URL env var or .env for Atlas
      # Default: local mongo service (Option A)
      - MONGODB_URL=mongodb://mongo:27017
      - MONGODB_DB_NAME=ipsecscope
      - UPLOAD_DIR=/app/data/uploads
      - REPORT_DIR=/app/data/reports
      - MAX_UPLOAD_MB=200
      - WORKERS=2
      - LOG_LEVEL=INFO
    depends_on:
      mongo:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: ipsecscope-frontend
    restart: unless-stopped
    ports:
      - "8080:80"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  mongo_data:
