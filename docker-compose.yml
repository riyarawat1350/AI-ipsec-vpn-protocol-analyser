services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: ipsecscope-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data
    environment:
      - HOST=0.0.0.0
      - PORT=8000
      - DATABASE_URL=sqlite:////app/data/ipsecscope.db
      - UPLOAD_DIR=/app/data/uploads
      - REPORT_DIR=/app/data/reports
      - MAX_UPLOAD_MB=200
      - WORKERS=2
      - LOG_LEVEL=INFO
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 3

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: ipsecscope-frontend
    restart: unless-stopped
    ports:
      - "8080:80"
    depends_on:
      backend:
        condition: service_healthy
