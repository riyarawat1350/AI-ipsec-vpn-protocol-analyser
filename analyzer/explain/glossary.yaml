# IPsecScope Technical & Plain-Language Glossary
# Minimum 75 entries covering all protocol, cryptographic, and operational terminology.
# Schema: id, name, expansion, simple (<=25 words), analogy, why_it_matters, technical

- id: "ipsec"
  name: "IPsec"
  expansion: "Internet Protocol Security"
  simple: "A set of rules that secures communication between computers by encrypting and verifying network packets."
  analogy: "Like putting your letters inside armored, tamper-evident locked courier envelopes before mailing."
  why_it_matters: "Without IPsec, anyone tapping the network path can read or modify your private business communications."
  technical: "A standards suite defined in RFC 4301 operating at OSI Layer 3 using AH and ESP protocols."

- id: "vpn"
  name: "VPN"
  expansion: "Virtual Private Network"
  simple: "An encrypted connection over the public internet that securely links remote computers or branch offices together."
  analogy: "A secure private underground tunnel built directly under a busy public highway."
  why_it_matters: "Enables secure transmission of confidential corporate data across untrusted public networks."
  technical: "Logical point-to-point or site-to-site network overlay providing privacy, authentication, and packet integrity."

- id: "ike"
  name: "IKE"
  expansion: "Internet Key Exchange"
  simple: "The automated negotiation protocol that lets two gateways agree on encryption keys and security settings."
  analogy: "Two diplomats meeting behind closed doors to establish a secret shared codebook."
  why_it_matters: "Automates the dangerous process of exchanging cryptographic keys without human error or plaintext exposure."
  technical: "UDP-based control plane protocol operating on port 500/4500 defined by RFC 2409 and RFC 7296."

- id: "ikev1"
  name: "IKEv1"
  expansion: "Internet Key Exchange Version 1"
  simple: "An older, retired version of the key exchange protocol published in 1998."
  analogy: "An obsolete rotary telephone lock that lacks modern safety catches."
  why_it_matters: "Officially deprecated by RFC 9395; suffers from slow negotiations, identity leaks, and lack of modern ciphers."
  technical: "Defined by RFC 2409; utilizes complex two-phase negotiations (Main/Aggressive Mode and Quick Mode)."

- id: "ikev2"
  name: "IKEv2"
  expansion: "Internet Key Exchange Version 2"
  simple: "The modern, fast, and robust standard for establishing secure IPsec VPN connections."
  analogy: "A modern biometric airlock with built-in defense against impersonation and line-dropping."
  why_it_matters: "Provides faster connection times, native NAT support, stronger identity protection, and automated recovery."
  technical: "Defined by RFC 7296; streamlines connection establishment into IKE_SA_INIT and IKE_AUTH exchanges."

- id: "esp"
  name: "ESP"
  expansion: "Encapsulating Security Payload"
  simple: "The IPsec component that scrambles user data so eavesdroppers cannot read it."
  analogy: "An opaque armored vehicle transporting cash that conceals both cargo and contents."
  why_it_matters: "Guarantees confidentiality, data origin authentication, and protection against unauthorized packet modification."
  technical: "IP protocol 50 (or UDP 4500 encapsulation) providing encryption, origin authentication, and anti-replay services."

- id: "ah"
  name: "AH"
  expansion: "Authentication Header"
  simple: "An IPsec protocol that checks data hasn't been tampered with, but does not hide the contents."
  analogy: "A transparent plastic security bag with an unbroken wax seal; you can see inside, but can't tamper."
  why_it_matters: "Rarely used today because it offers zero privacy and breaks when passing through network address routers."
  technical: "IP protocol 51 calculating a checksum over immutable IP header fields and payload; incompatible with NAT."

- id: "nat-t"
  name: "NAT-T"
  expansion: "Network Address Translation Traversal"
  simple: "A technique that wraps IPsec packets inside standard UDP packets so home routers can forward them."
  analogy: "Putting a non-standard parcel inside a standard postal box so regular mail sorters can process it."
  why_it_matters: "Without NAT-T, VPN tunnels fail whenever one party sits behind a standard home or office router."
  technical: "Defined in RFC 3947/3948; encapsulates IKE and ESP inside UDP port 4500 with a 4-byte non-ESP marker."

- id: "sa"
  name: "SA"
  expansion: "Security Association"
  simple: "A formal agreement between two VPN endpoints specifying which cryptographic keys and algorithms to use."
  analogy: "A signed security contract detailing the exact lock model, key code, and expiration date."
  why_it_matters: "Without a valid Security Association, endpoints cannot negotiate or transmit encrypted packets."
  technical: "Unidirectional security contract indexed by destination IP, security protocol (ESP/AH), and SPI."

- id: "spi"
  name: "SPI"
  expansion: "Security Parameter Index"
  simple: "A unique tracking tag placed on each encrypted packet to identify which key unlocks it."
  analogy: "The luggage claim check tag on your suitcase pointing the handler to the correct owner."
  why_it_matters: "Allows the receiving firewall to immediately look up the decryption key and security policy."
  technical: "A 32-bit (ESP/AH) or 64-bit (IKE) unencrypted arbitrary identifier placed in packet headers."

- id: "dh-group"
  name: "DH Group"
  expansion: "Diffie-Hellman Group"
  simple: "A mathematical recipe that lets two computers safely create a shared secret key over public wires."
  analogy: "Two people mixing paint colors in public such that onlookers cannot deduce the original secret shades."
  why_it_matters: "Using weak or small groups allows adversaries with supercomputers to crack keys and decrypt traffic."
  technical: "Defines cyclic group parameters and key lengths (MODP or ECP) used for key agreement (RFC 3526/5903)."

- id: "pfs"
  name: "PFS"
  expansion: "Perfect Forward Secrecy"
  simple: "A property ensuring that if a current key is stolen, past recorded conversations remain completely safe."
  analogy: "Changing house locks every day so a stolen key only opens doors for 24 hours, never the past."
  why_it_matters: "Prevents attackers who record encrypted traffic today from decrypting historical records years later."
  technical: "Requires generating fresh Diffie-Hellman exchanges for each child SA rather than deriving from IKE root keys."

- id: "prf"
  name: "PRF"
  expansion: "Pseudorandom Function"
  simple: "A cryptographic algorithm used to stretch short passwords or master secrets into long, unpredictable keys."
  analogy: "A machine that rolls and expands a single ball of gold into miles of strong, uniform security wire."
  why_it_matters: "Weak functions produce predictable encryption keys that attackers can guess through automated tools."
  technical: "Deterministic algorithm outputting pseudorandom byte streams (e.g. HMAC-SHA256) per RFC 7296 §2.13."

- id: "integrity"
  name: "Integrity"
  expansion: "Data Integrity Verification"
  simple: "The guarantee that network packets were not altered, forged, or damaged during transit."
  analogy: "A tamper-proof holographic sticker ensuring the package has not been opened in transit."
  why_it_matters: "Protects against malicious injection attacks where adversaries secretly change payment or command data."
  technical: "Enforced using keyed Hash-based Message Authentication Codes (HMAC) or AEAD authentication tags."

- id: "aead"
  name: "AEAD"
  expansion: "Authenticated Encryption with Associated Data"
  simple: "A modern cipher design that simultaneously encrypts the data and proves nobody tampered with it."
  analogy: "A bulletproof safe with an integrated digital alarm that screams if anyone scratches the lock."
  why_it_matters: "Stops padding attacks and runs dramatically faster on modern computer processors than separate ciphers."
  technical: "Cryptographic mode (e.g. AES-GCM, ChaCha20-Poly1305) producing ciphertext and MAC tag in one pass."

- id: "aes-gcm"
  name: "AES-GCM"
  expansion: "Advanced Encryption Standard in Galois/Counter Mode"
  simple: "The gold standard cipher used worldwide for high-speed, authenticated confidential communication."
  analogy: "The modern high-tech titanium vault lock used by global banks and intelligence agencies."
  why_it_matters: "Recommended by NIST and RFC 8247 for peak security, hardware speed, and built-in tamper resistance."
  technical: "NIST SP 800-38D block cipher mode pairing counter encryption with Galois field polynomial authentication."

- id: "3des"
  name: "3DES"
  expansion: "Triple Data Encryption Standard"
  simple: "An obsolete encryption algorithm from the 1990s that runs the ancient DES cipher three times."
  analogy: "Wrapping an old wooden door with three antique chains instead of installing a modern steel door."
  why_it_matters: "Vulnerable to the Sweet32 collision attack; officially disallowed by NIST and retired worldwide."
  technical: "Applies DES three times with 64-bit block size; vulnerable to birthday collisions after 32 GB of data."

- id: "des"
  name: "DES"
  expansion: "Data Encryption Standard"
  simple: "A legacy cipher from 1977 with keys so short that modern laptops can break them in minutes."
  analogy: "A tiny luggage padlock that can be opened in seconds using a common paperclip."
  why_it_matters: "Provides zero real security; completely broken and forbidden across all production environments."
  technical: "56-bit symmetric block cipher cracked via brute force in 1999; deprecated across all cryptographic standards."

- id: "md5"
  name: "MD5"
  expansion: "Message Digest 5"
  simple: "A severely broken hashing function from 1991 that can easily be manipulated by attackers."
  analogy: "A blurry signature stamp that can be effortlessly forged by any high schooler."
  why_it_matters: "Attackers can generate collision packets with identical hashes, bypassing integrity checks."
  technical: "128-bit hash function vulnerable to collision generation in seconds; deprecated per RFC 6151."

- id: "sha-1"
  name: "SHA-1"
  expansion: "Secure Hash Algorithm 1"
  simple: "A phased-out hashing algorithm proven vulnerable to practical mathematical collision attacks."
  analogy: "A worn car ignition key that accidentally unlocks dozens of other vehicles in the parking lot."
  why_it_matters: "Attackers can craft fake certificates or forged messages sharing identical SHA-1 hashes."
  technical: "160-bit digest with practical collision attacks demonstrated in 2017 (SHAttered); banned by NIST."

- id: "sha-2"
  name: "SHA-2"
  expansion: "Secure Hash Algorithm 2 (SHA-256 / SHA-384 / SHA-512)"
  simple: "The current trusted family of cryptographic hashing algorithms providing high security."
  analogy: "A unique biometric digital fingerprint that cannot be duplicated or falsified."
  why_it_matters: "Required by NIST SP 800-77 for all production VPN hashing, integrity, and key derivation."
  technical: "FIPS 180-4 standard defining collision-resistant hash functions with digest lengths up to 512 bits."

- id: "psk"
  name: "PSK"
  expansion: "Pre-Shared Key"
  simple: "A shared secret password configured manually on both ends of a VPN connection before connecting."
  analogy: "A secret verbal password agreed upon beforehand to gain entry at the front door."
  why_it_matters: "Prone to weak passwords, accidental leakage, and impossible to revoke for single users safely."
  technical: "Static shared symmetric secret used for peer authentication during IKE Main or Aggressive Mode."

- id: "main-mode"
  name: "Main Mode"
  expansion: "IKEv1 Main Mode Exchange"
  simple: "A six-packet IKEv1 handshake that shields the identities of connecting parties from eavesdroppers."
  analogy: "Exchanging sealed credential cards inside an already darkened, private meeting booth."
  why_it_matters: "Protects user and device identities, unlike the insecure Aggressive Mode."
  technical: "Six-message exchange separating cryptographic parameter setup, Diffie-Hellman exchange, and identity proof."

- id: "aggressive-mode"
  name: "Aggressive Mode"
  expansion: "IKEv1 Aggressive Mode Exchange"
  simple: "A hasty three-packet handshake that sends device identities and authentication hashes out in the clear."
  analogy: "Shouting your name and password across a crowded hallway to enter a room faster."
  why_it_matters: "Allows anyone watching the wire to steal the authentication hash and crack the VPN password offline."
  technical: "Three-packet exchange combining SA proposals, key exchange, and identity; exposes PSK hash to offline attacks."

- id: "nonce"
  name: "Nonce"
  expansion: "Number Used Once"
  simple: "A random number generated for a single handshake to ensure old conversations cannot be replayed."
  analogy: "A single-use disposable lottery ticket timestamped for this exact minute."
  why_it_matters: "Prevents attackers from re-sending recorded handshake messages to trick the firewall."
  technical: "High-entropy random bit string exchanged in IKE_SA_INIT and used in SKEYSEED calculation."

- id: "notify"
  name: "Notify Payload"
  expansion: "IKE Notification Message"
  simple: "A status or error message sent between VPN peers explaining connection state or failures."
  analogy: "A dashboard warning light indicating tire pressure or confirming connection status."
  why_it_matters: "Essential for diagnosing why a connection dropped or detecting active denial-of-service cookies."
  technical: "IKE payload type 41 transmitting status notifications, error codes, or NAT detection hashes."

- id: "vendor-id"
  name: "Vendor ID"
  expansion: "Vendor Identification Payload"
  simple: "A digital badge in the handshake announcing the software brand or proprietary features supported."
  analogy: "Wearing a nametag showing your company and department at a conference."
  why_it_matters: "Helps identify device models and software versions, but also reveals software details to attackers."
  technical: "Payload type 43 carrying MD5/SHA1 hashes or ASCII strings identifying gateway implementation."

- id: "cookie"
  name: "Cookie"
  expansion: "IKE Anti-DoS Cookie"
  simple: "A cryptographic token sent by a busy VPN server to verify the caller's real IP address."
  analogy: "A callback confirmation number texted to your phone before customer support assists you."
  why_it_matters: "Protects VPN gateways from crashing during memory-exhaustion flooding attacks."
  technical: "Stateless notification (type 16390) requiring initiators to prove IP ownership before resource allocation."

- id: "sequence-number"
  name: "Sequence Number"
  expansion: "ESP Sequence Counter"
  simple: "A sequential counter stamped on each encrypted packet to guarantee proper arrival order."
  analogy: "Page numbers printed on a confidential manuscript so you notice if a page is stolen."
  why_it_matters: "Enables anti-replay detection and reveals dropped or disordered network packets."
  technical: "Monotonically increasing 32-bit (or 64-bit Extended) counter in the ESP header, starting at 1."

- id: "replay"
  name: "Replay Attack"
  expansion: "Network Packet Replay Attack"
  simple: "An attack where an adversary copies valid encrypted packets and transmits them again later."
  analogy: "Stealing an approved payroll transfer form and resubmitting it every day to drain funds."
  why_it_matters: "Can cause duplicate financial transactions or disrupt network connections without cracking keys."
  technical: "Adversary captures valid wire ciphertext and reinjects it into the link to duplicate actions."

- id: "anti-replay"
  name: "Anti-Replay Window"
  expansion: "Sliding Window Anti-Replay Check"
  simple: "A defensive memory sliding window that discards duplicate or excessively delayed packets."
  analogy: "A ticket puncher that rejects any ticket that was already scanned or dated last week."
  why_it_matters: "Neutralizes packet replay attacks automatically inside the gateway hardware."
  technical: "Bitmask sliding window (e.g. 64 or 1024 packets) tracking received sequence numbers (RFC 4303 §3.4.3)."

- id: "esp-null"
  name: "ESP-NULL"
  expansion: "ESP NULL Encryption Algorithm"
  simple: "An IPsec mode where packets have security headers but user data is transmitted completely unencrypted."
  analogy: "An armored cash truck with glass windows and no locks on the rear doors."
  why_it_matters: "Critical misconfiguration: anyone watching the wire can read every email, password, and file."
  technical: "RFC 2410 transform ID 11 providing packet authentication or encapsulation without confidentiality."

- id: "handshake"
  name: "Handshake"
  expansion: "Cryptographic Protocol Handshake"
  simple: "The initial conversation where two systems introduce themselves and agree on safety rules."
  analogy: "Two business partners shaking hands, presenting IDs, and signing a confidentiality agreement."
  why_it_matters: "If the handshake is insecure, the entire subsequent encrypted tunnel is compromised."
  technical: "Ordered series of request-response packet exchanges establishing session keys and security policies."

- id: "initiator"
  name: "Initiator"
  expansion: "VPN Connection Initiator"
  simple: "The computer or gateway that begins the conversation by proposing a secure connection."
  analogy: "The person who dials the phone number to start a phone call."
  why_it_matters: "Chooses which encryption algorithms and security proposals to offer to the remote peer."
  technical: "The peer transmitting the first IKE_SA_INIT or Phase 1 proposal packet (Initiator SPI set, Responder zero)."

- id: "responder"
  name: "Responder"
  expansion: "VPN Connection Responder"
  simple: "The receiving VPN server that listens for incoming connection requests and accepts or rejects them."
  analogy: "The person who answers the ringing telephone and decides whether to accept the call."
  why_it_matters: "Controls the final security level by selecting the specific cipher from the initiator's offers."
  technical: "The peer receiving the initial request and replying with its chosen proposal and responder SPI."

- id: "rekey"
  name: "Rekey"
  expansion: "Cryptographic Key Refresh"
  simple: "The automatic process of replacing old encryption keys with fresh ones before they expire."
  analogy: "Changing the passcodes on office keycards every quarter to maintain strong building security."
  why_it_matters: "Limits the amount of data encrypted under one key, preventing statistical cryptographic attacks."
  technical: "Negotiation of a replacement SA using CREATE_CHILD_SA or Quick Mode before time/byte bounds expire."

- id: "tunnel-mode"
  name: "Tunnel Mode"
  expansion: "IPsec Tunnel Mode"
  simple: "An IPsec mode that wraps the entire original packet, including original addresses, inside a brand-new outer packet."
  analogy: "Placing a sealed, stamped letter inside a second blank protective envelope with different courier addresses."
  why_it_matters: "Hides internal company IP addresses and topology from public internet observers."
  technical: "Standard gateway-to-gateway mode encapsulating original IP header and payload within an outer IP header."

- id: "transport-mode"
  name: "Transport Mode"
  expansion: "IPsec Transport Mode"
  simple: "An IPsec mode that encrypts only the payload while leaving original computer IP headers visible."
  analogy: "Scrambling the writing inside a postcard while keeping the sender and recipient addresses exposed."
  why_it_matters: "Used primarily for server-to-server connections, but reveals endpoint communication patterns."
  technical: "Host-to-host mode inserting ESP/AH between the existing IP header and transport protocol (TCP/UDP)."

- id: "fragmentation"
  name: "Fragmentation"
  expansion: "IP Packet Fragmentation"
  simple: "Breaking large packets into smaller pieces when they exceed the network's maximum allowed size."
  analogy: "Splitting an oversized encyclopedia into three smaller parcels to fit through a narrow mail slot."
  why_it_matters: "Causes high packet loss, connection stalls, and vulnerability to fragment reassembly attacks."
  technical: "Splitting of datagrams exceeding path MTU; IKEv2 Fragmentation (RFC 7383) solves handshake drops."

- id: "not-observable"
  name: "Not Observable"
  expansion: "Observability Boundary Limitation"
  simple: "Data that cannot be seen or analyzed because it is protected by strong encryption on the wire."
  analogy: "Being unable to read the contents of a sealed steel bank safe without the owner's key."
  why_it_matters: "Prevents false claims of compliance for inner tunnel payloads when encryption keys are unavailable."
  technical: "Payloads such as IKE_AUTH contents and ESP inner traffic protected by ephemeral encryption keys."

- id: "pcap"
  name: "PCAP"
  expansion: "Packet Capture File Format"
  simple: "The standard file format used by security tools to store recorded network conversations."
  analogy: "An audio recording tape preserving an entire phone conversation word for word."
  why_it_matters: "Allows security analysts to perform forensic inspections and automated compliance audits."
  technical: "Classic file format (Libpcap) recording packet timestamps, captured lengths, and raw frame bytes."

- id: "pcapng"
  name: "PCAPNG"
  expansion: "Next Generation Packet Capture"
  simple: "A modern, extensible file format for capturing network traffic across multiple interfaces with rich metadata."
  analogy: "A multi-track studio digital master recording with timestamps, artist notes, and channel metadata."
  why_it_matters: "Preserves interface names, drop counters, and packet comments for accurate network diagnosis."
  technical: "Block-structured capture container format supporting multiple interfaces, name resolution, and nano-precision."

- id: "packet"
  name: "Packet"
  expansion: "Network Data Packet"
  simple: "A single unit of digital data transmitted across a computer network."
  analogy: "A single envelope containing a short letter sent through the postal service."
  why_it_matters: "All network traffic and security attacks consist of individual packets traveling across wires."
  technical: "Formatted block of user data and control headers routed across packet-switched computer networks."

- id: "flow"
  name: "Flow"
  expansion: "Unidirectional ESP/AH Flow"
  simple: "A continuous stream of encrypted IPsec packets traveling in one direction between two gateways."
  analogy: "All vehicles traveling northbound on a specific dedicated toll highway lane."
  why_it_matters: "Analyzing flows reveals packet drop rates, tunnel activity, and potential denial-of-service outages."
  technical: "Sequence of ESP/AH packets sharing identical source IP, destination IP, and SPI attributes."

- id: "session"
  name: "Session"
  expansion: "IKE Management Session"
  simple: "The complete key negotiation dialogue between two VPN gateways from initial hello to teardown."
  analogy: "An entire telephone call between two people from 'Hello' to 'Goodbye'."
  why_it_matters: "Determines whether the VPN successfully established and tracks renegotiations and errors."
  technical: "Stateful IKE association bounded by initiator and responder SPIs across UDP ports 500/4500."

- id: "risk-score"
  name: "Risk Score"
  expansion: "Quantitative Risk Score (0 - 100)"
  simple: "A mathematical score measuring the severity and likelihood of a discovered security weakness."
  analogy: "A credit score, but where higher numbers mean much greater danger to your organization."
  why_it_matters: "Helps engineers prioritize fixing dangerous vulnerabilities first before addressing minor warnings."
  technical: "R = (Impact * Likelihood / 25) * 100 * (0.5 + 0.5 * Confidence); capped at 100.0."

- id: "impact"
  name: "Impact"
  expansion: "Vulnerability Impact Rating (1 - 5)"
  simple: "A rating measuring how much harm could occur if an attacker successfully exploited the issue."
  analogy: "The severity of a car crash depending on whether you hit a safety cone or a concrete wall."
  why_it_matters: "High impact issues (like plaintext leaks) demand immediate emergency response."
  technical: "Five-point ordinal scale (1=Minimal, 2=Low, 3=Moderate, 4=High, 5=Catastrophic compromise)."

- id: "likelihood"
  name: "Likelihood"
  expansion: "Exploitation Likelihood Rating (1 - 5)"
  simple: "A rating measuring how easy and probable it is for someone to exploit the weakness."
  analogy: "How likely it is that someone checks your front door when walking down a crowded street."
  why_it_matters: "Even severe weaknesses present lower immediate risk if they are almost impossible to trigger."
  technical: "Five-point scale reflecting attacker access, automation availability, and protocol preconditions."

- id: "confidence"
  name: "Confidence"
  expansion: "Detection Confidence Factor (0.0 - 1.0)"
  simple: "How certain our automated analyzer is that the finding is genuine and not a misunderstanding."
  analogy: "How certain a witness is after seeing someone up close in daylight versus far away at night."
  why_it_matters: "Prevents alarms and alert fatigue caused by speculative or uncertain detections."
  technical: "Certainty multiplier (1.0 for deterministic rule matches, lower for heuristics and statistical estimates)."

- id: "severity"
  name: "Severity"
  expansion: "Finding Severity Band"
  simple: "A category label (Critical, High, Medium, Low, or Info) grouping findings by urgency."
  analogy: "Hospital emergency triage color codes sorting patients from walking wounded to emergency surgery."
  why_it_matters: "Provides executive and management teams with instant visibility into system health."
  technical: "Categorization bands: Critical (>=85), High (>=65), Medium (>=35), Low (>=15), Info (<15 or unrated)."

- id: "posture-grade"
  name: "Posture Grade"
  expansion: "Security Posture Letter Grade (A - F)"
  simple: "An overall report card letter grade summarizing the defensive health of your VPN configuration."
  analogy: "A school report card grade reflecting your overall exam performance across all subjects."
  why_it_matters: "Gives executives an instant, intuitive summary of whether the network meets security standards."
  technical: "Computed posture score derived from aggregate risk reduction formula: A, B, C, D, or F."

- id: "evidence"
  name: "Evidence"
  expansion: "Diagnostic Packet Evidence"
  simple: "The exact raw packet bytes and field values that prove a finding is real."
  analogy: "A clear fingerprint photograph taken by a detective at a crime scene."
  why_it_matters: "Allows firewall engineers to verify the issue in Wireshark without taking anyone's word for it."
  technical: "Data structure containing packet number, timestamp, field path, hex dump excerpt, and decoded value."

- id: "heuristic"
  name: "Heuristic"
  expansion: "Heuristic Detection Method"
  simple: "A practical detection rule based on experience and patterns rather than rigid mathematical certainty."
  analogy: "Assuming it is raining because people are opening umbrellas, rather than looking at the sky."
  why_it_matters: "Catches real-world attacks and anomalies that don't violate strict RFC syntax rules."
  technical: "Rule-of-thumb analysis evaluating behavioral patterns, entropy shifts, or timing thresholds."

- id: "false-positive"
  name: "False Positive"
  expansion: "False Alarm Detection"
  simple: "A security alert raised by a tool when nothing is actually wrong with the system."
  analogy: "A smoke detector beeping loudly when you are just making toast in the kitchen."
  why_it_matters: "Too many false alarms cause engineers to ignore real alerts, leaving networks vulnerable."
  technical: "Incorrect classification of benign operational traffic as malicious or non-compliant."

- id: "fingerprint"
  name: "Fingerprint"
  expansion: "Device / Finding Fingerprint"
  simple: "A distinctive pattern of values that identifies a specific software model or unique finding."
  analogy: "Recognizing a friend from behind just by the distinctive jacket and shoes they always wear."
  why_it_matters: "Enables automatic identification of outdated or vulnerable firewall operating systems."
  technical: "Cryptographic hash or structured token uniquely identifying software vendor or finding instance."

- id: "ecp"
  name: "ECP"
  expansion: "Elliptic Curve Cryptography (Elliptic Curve Groups)"
  simple: "Advanced math providing ultra-strong encryption using tiny keys, making tunnels faster and safer."
  analogy: "A pocket-sized titanium lock that is harder to pick than a massive iron bank vault door."
  why_it_matters: "Delivers maximum security with minimal processor battery and bandwidth overhead."
  technical: "Diffie-Hellman groups using NIST curves (P-256, P-384, P-521) or Edwards curves (X25519) per RFC 5903/8247."

- id: "modp"
  name: "MODP"
  expansion: "Modular Exponential Group"
  simple: "Traditional Diffie-Hellman mathematical groups that rely on very large prime numbers."
  analogy: "A heavy, traditional iron key that works reliably but needs to be huge to stay secure."
  why_it_matters: "Groups smaller than 2048 bits (like Group 2 and Group 5) are now dangerously weak."
  technical: "Finite field Diffie-Hellman key exchange based on discrete logarithms in multiplicative groups of primes."

- id: "certificate"
  name: "Certificate"
  expansion: "X.509 Digital Identity Certificate"
  simple: "An electronic passport signed by a trusted authority proving the true identity of a server."
  analogy: "An official government passport showing your photo, seal, and expiration date."
  why_it_matters: "Prevents impersonation attacks and eliminates the risks of shared passwords."
  technical: "X.509 PKI credential binding a public key to an identity via a trusted Certificate Authority signature."

- id: "mitre-attack"
  name: "MITRE ATT&CK"
  expansion: "MITRE Adversarial Tactics, Techniques, and Common Knowledge"
  simple: "A globally recognized encyclopedia of real-world tactics and techniques used by hackers."
  analogy: "A master playbook listing all known tricks and moves used by opposing sports teams."
  why_it_matters: "Connects detected VPN vulnerabilities directly to known real-world cyberattack methods."
  technical: "Standardized taxonomy mapping adversary behaviors to techniques (e.g. T1600 for encrypted channel attacks)."

- id: "ioc"
  name: "IOC"
  expansion: "Indicator of Compromise"
  simple: "A forensic artifact, like a suspicious IP or abnormal payload, pointing to an active attack."
  analogy: "Muddy footprints found on the carpet right beneath a broken window."
  why_it_matters: "Helps incident response teams spot, block, and contain security breaches quickly."
  technical: "Observable evidence indicating unauthorized network reconnaissance, intrusion, or data exfiltration."

- id: "cipher"
  name: "Cipher"
  expansion: "Cryptographic Cipher Algorithm"
  simple: "An algorithm or mathematical formula used to encrypt readable text into secret scrambled code."
  analogy: "A secret code wheel that swaps letters according to an intricate mathematical formula."
  why_it_matters: "Weak ciphers let adversaries decrypt and inspect sensitive corporate and personal information."
  technical: "Mathematical function (symmetric or asymmetric) transforming plaintext into ciphertext and vice-versa."

- id: "transform"
  name: "Transform"
  expansion: "IKE Security Transform"
  simple: "A specific cryptographic component (like encryption, hashing, or DH group) offered in a proposal."
  analogy: "A single ingredient listed in a recipe, such as flour, salt, or sugar."
  why_it_matters: "VPN gateways must find matching transform choices on both ends to agree on a connection."
  technical: "IKE sub-structure carrying transform type (ENCR, PRF, INTEG, D-H) and specific algorithm IDs."

- id: "proposal"
  name: "Proposal"
  expansion: "IKE Security Association Proposal"
  simple: "A complete bundle of cryptographic options offered by one gateway to the other."
  analogy: "A fixed menu option in a restaurant offering soup, steak, and dessert together."
  why_it_matters: "If proposals don't align, the gateways cannot agree and the connection drops immediately."
  technical: "Data structure containing proposal number, protocol ID, SPI size, and list of supported transforms."

- id: "payload"
  name: "Payload"
  expansion: "IKE Message Payload"
  simple: "A labeled section of an IKE packet carrying specific information like keys, IDs, or errors."
  analogy: "A labeled compartment inside an organizer box holding batteries, cables, or screws."
  why_it_matters: "Standardized payloads allow firewalls from different vendors to understand each other."
  technical: "Self-describing header containing Next Payload, Critical bit, and payload length in octets."

- id: "exchange-type"
  name: "Exchange Type"
  expansion: "IKE Message Exchange Type"
  simple: "A number indicating what kind of conversation step an IKE packet represents."
  analogy: "The subject line on an email explaining if it is an invitation, confirmation, or notice."
  why_it_matters: "Tells the firewall parser how to interpret the payloads contained in the message."
  technical: "Header field identifying handshake phase (e.g. 34 for IKE_SA_INIT, 35 for IKE_AUTH)."

- id: "nat-keepalive"
  name: "NAT Keepalive"
  expansion: "NAT-T Keepalive Packet"
  simple: "A tiny 1-byte packet sent periodically to keep router port mappings open during quiet periods."
  analogy: "Tapping your foot on an elevator door sensor so the doors don't close on you."
  why_it_matters: "Prevents home and branch office routers from prematurely closing idle VPN tunnels."
  technical: "Single 0xFF byte sent over UDP port 4500 every 20-30 seconds without an ESP or IKE header (RFC 3948)."

- id: "iv"
  name: "IV"
  expansion: "Initialization Vector"
  simple: "A random starting block fed into a cipher to ensure two identical messages look completely different."
  analogy: "Adding a unique random pinch of spice so two identical soups never taste the same to a spy."
  why_it_matters: "Reusing initialization vectors allows eavesdroppers to deduce plaintext patterns and steal keys."
  technical: "Cryptographic input parameter guaranteeing cipher block randomization across distinct encryptions."

- id: "mac"
  name: "MAC"
  expansion: "Message Authentication Code"
  simple: "A cryptographic stamp confirming that a message genuinely came from the sender and was not altered."
  analogy: "An embossed royal wax seal stamped onto an official decree."
  why_it_matters: "Without an authentic MAC, adversaries can inject falsified commands into encrypted tunnels."
  technical: "Keyed digest (such as HMAC-SHA256 or GCM auth tag) verifying authenticity and message integrity."

- id: "eavesdropping"
  name: "Eavesdropping"
  expansion: "Passive Wiretapping / Eavesdropping"
  simple: "Silently listening in on private network communications without changing anything."
  analogy: "A spy sitting in the next booth listening to your private business conversation."
  why_it_matters: "Strong encryption prevents eavesdroppers from reading confidential corporate secrets."
  technical: "Passive interception of transmission media violating confidentiality without altering packet data."

- id: "downgrade-attack"
  name: "Downgrade Attack"
  expansion: "Cryptographic Downgrade Attack"
  simple: "An attack where a hacker tricks both computers into abandoning strong security and using broken ciphers."
  analogy: "A con artist convincing guards to turn off high-tech retina scanners and use a rusty padlock."
  why_it_matters: "Allows attackers to break connections that were designed to be modern and secure."
  technical: "Man-in-the-middle manipulation forcing peers to negotiate legacy cipher suites (e.g. DES or MD5)."

- id: "policy-baseline"
  name: "Policy Baseline"
  expansion: "Security Compliance Policy Baseline"
  simple: "A documented set of rules defining the minimum acceptable security standards for an organization."
  analogy: "The official building fire and safety codes that every architect must follow."
  why_it_matters: "Ensures all VPN connections across the company adhere to verified safety standards."
  technical: "Configurable benchmark (e.g. NIST SP 800-77 Rev. 1) against which observed proposals are evaluated."

- id: "cve"
  name: "CVE"
  expansion: "Common Vulnerabilities and Exposures"
  simple: "A globally standardized identification number assigned to a publicly known software bug."
  analogy: "A unique public serial number assigned to a safety recall on a car model."
  why_it_matters: "Enables engineers to look up exact fixes, patches, and exploits for firewall firmware."
  technical: "MITRE-maintained registry cataloging public cybersecurity vulnerabilities (e.g. CVE-2023-38035)."

- id: "cvss"
  name: "CVSS"
  expansion: "Common Vulnerability Scoring System"
  simple: "An industry-standard score from 0 to 10 measuring how dangerous a software bug is."
  analogy: "A Richter earthquake scale rating the physical damage potential of a tremor."
  why_it_matters: "Helps organizations prioritize patching the most hazardous software bugs first."
  technical: "Open standard framework assessing exploitability, privileges required, and CIA impact (0.0 - 10.0)."

- id: "icmp"
  name: "ICMP"
  expansion: "Internet Control Message Protocol"
  simple: "A helper protocol used by routers and computers to report connection errors and test reachability."
  analogy: "The postal return-to-sender card sent when an address does not exist."
  why_it_matters: "Carries essential 'Packet Too Big' notices needed for VPN tunnels to adjust packet sizes."
  technical: "IP protocol 1 supporting diagnostics (ping) and path MTU discovery; dropping causes black hole tunnels."

- id: "mtu"
  name: "MTU"
  expansion: "Maximum Transmission Unit"
  simple: "The largest packet size, measured in bytes, that a network connection can transmit without splitting."
  analogy: "The maximum height of a truck that can safely drive under an overpass bridge."
  why_it_matters: "VPN encryption adds extra headers; if packets exceed MTU, connections drop or stall."
  technical: "Maximum frame size (typically 1500 bytes on Ethernet) allowable on a physical or logical link layer."
