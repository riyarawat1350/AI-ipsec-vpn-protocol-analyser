policy_id: "nist_default"
version: "1.0"
description: "NIST SP 800-77 Rev. 1 baseline IPsec security policy"

tables:
  dh_impact:
    "1": 5     # MODP-768: Broken
    "2": 4     # MODP-1024: Weak
    "5": 3     # MODP-1536: Deprecated
    "22": 4    # MODP-1024/160: Weak
    "23": 3    # MODP-2048/224: Deprecated
    "24": 3    # MODP-2048/256: Deprecated
  encr_impact:
    "1": 5     # DES-IV64: Broken
    "2": 5     # DES: Broken
    "3": 3     # 3DES: Deprecated (Sweet32)
    "4": 4     # RC5: Weak
    "5": 4     # IDEA: Weak
    "6": 4     # CAST: Weak
    "7": 4     # Blowfish: Weak (64-bit block)
    "11": 5    # NULL: Plaintext
  integ_impact:
    "1": 2     # MD5: Weak (SRS §12.1: impact 2)
    "2": 1     # SHA1: Phased-out legacy

rules:
  # ── CRY-DH-001: Weak or broken Diffie-Hellman group ─────────────────────────
  - id: "CRY-DH-001"
    target: "observation"
    category: "Cryptography"
    title: "Weak or broken Diffie-Hellman group {name} (group {id})"
    explanation: "Diffie-Hellman group {name} ({id}) provides insufficient key exchange security under modern standards."
    why_this_matters: "Attackers with sufficient computing power can solve discrete logarithms for small groups, compromising forward secrecy."
    condition:
      all:
        - field: "kind"
          op: "eq"
          value: "dh"
        - field: "id"
          op: "in"
          value: [1, 2, 5, 22, 23, 24]
    impact:
      table: "dh_impact"
      default: 3
    likelihood:
      from: "role"
    confidence: 1.0
    group_by: ["session_id", "kind", "id"]
    references: ["NIST SP 800-77 Rev. 1", "RFC 8247 §2.4"]
    mitre: ["T1600.001"]
    recommendation_id: "REC-CRY-DH-001"
    plain_summary: "The VPN is using an outdated Diffie-Hellman mathematical group for key exchange."
    plain_impact: "Adversaries with high-performance computing power can compute secret keys and eavesdrop on private traffic."
    plain_fix: "Reconfigure both VPN gateways to use Diffie-Hellman Group 14 (MODP-2048) or modern elliptic curves."
    params:
      min_modp_bits: 2048

  # ── CRY-ENC-001: Broken or deprecated encryption cipher ─────────────────────
  - id: "CRY-ENC-001"
    target: "observation"
    category: "Cryptography"
    title: "Deprecated or broken encryption algorithm {name} ({id})"
    explanation: "Encryption cipher {name} ({id}) is deprecated or cryptographically broken."
    why_this_matters: "Broken ciphers like DES and 3DES are susceptible to practical brute force or collision attacks."
    condition:
      all:
        - field: "kind"
          op: "eq"
          value: "encr"
        - field: "id"
          op: "in"
          value: [1, 2, 3, 4, 5, 6, 7, 11]
    impact:
      table: "encr_impact"
      default: 3
    likelihood:
      from: "role"
    confidence: 1.0
    group_by: ["session_id", "kind", "id"]
    references: ["NIST SP 800-131A Rev. 2", "RFC 8247 §2.1"]
    mitre: ["T1600.001"]
    recommendation_id: "REC-CRY-ENC-001"
    plain_summary: "The VPN is using broken or obsolete encryption ciphers such as DES or 3DES."
    plain_impact: "Legacy ciphers can be cracked in hours or days, allowing attackers to read private transmitted data."
    plain_fix: "Upgrade encryption profiles to AES-GCM (128 or 256 bits) and remove legacy ciphers."
    params:
      allowed_ciphers: ["AES-GCM", "AES-CBC", "ChaCha20-Poly1305"]

  # ── CRY-ENC-002: Legacy CBC mode encryption ─────────────────────────────────
  - id: "CRY-ENC-002"
    target: "observation"
    category: "Cryptography"
    title: "Legacy CBC mode encryption in use: {name}"
    explanation: "AES-CBC is in use. While acceptable when paired with a strong HMAC, migration to modern authenticated encryption (AEAD such as AES-GCM) is recommended."
    why_this_matters: "AEAD algorithms prevent padding oracle attacks and provide higher cryptographic efficiency."
    condition:
      all:
        - field: "kind"
          op: "eq"
          value: "encr"
        - field: "id"
          op: "in"
          value: [7, 12]
    impact: 1
    likelihood:
      from: "role"
    confidence: 1.0
    override_severity: "Info"
    group_by: ["session_id", "kind", "id"]
    references: ["RFC 8247 §2.1.2"]
    recommendation_id: "REC-CRY-ENC-002"
    plain_summary: "The VPN uses legacy CBC mode encryption instead of modern authenticated encryption."
    plain_impact: "CBC mode is slower and can be vulnerable to padding oracle tampering attacks if HMAC verification fails."
    plain_fix: "Migrate encryption profiles from AES-CBC to authenticated encryption (AEAD) like AES-GCM."
    params: {}

  # ── CRY-INT-001: Weak integrity or PRF hash algorithm ───────────────────────
  - id: "CRY-INT-001"
    target: "observation"
    category: "Cryptography"
    title: "Weak hash/integrity algorithm in use: {name} ({id})"
    explanation: "The integrity or PRF algorithm {name} ({id}) has known collision or length-extension vulnerabilities."
    why_this_matters: "Using MD5 or SHA1 risks integrity degradation and message forgery."
    condition:
      all:
        - field: "kind"
          op: "in"
          value: ["prf", "integ", "hash"]
        - field: "id"
          op: "in"
          value: [1, 2]
    impact:
      table: "integ_impact"
      default: 2
    likelihood:
      from: "role"
    confidence: 1.0
    group_by: ["session_id", "kind", "id"]
    references: ["NIST SP 800-131A", "RFC 8247 §2.2"]
    mitre: ["T1600.001"]
    recommendation_id: "REC-CRY-INT-001"
    plain_summary: "The VPN uses a weak hashing algorithm (MD5 or SHA-1) for packet integrity verification."
    plain_impact: "Attackers can generate forged messages with identical hash checksums to tamper with tunnel data."
    plain_fix: "Configure SHA-2 (SHA-256 or SHA-512) for all integrity and pseudorandom functions."
    params:
      min_hash_bits: 256

  # ── CRY-INT-002: Missing integrity protection ───────────────────────────────
  - id: "CRY-INT-002"
    target: "observation"
    category: "Cryptography"
    title: "Missing integrity algorithm (NONE) with non-AEAD cipher"
    explanation: "Integrity protection algorithm is set to NONE (id 0) without an authenticated encryption cipher."
    why_this_matters: "Unauthenticated encryption allows active attackers to alter encrypted payloads undetected."
    condition:
      all:
        - field: "kind"
          op: "eq"
          value: "integ"
        - field: "id"
          op: "eq"
          value: 0
    impact: 5
    likelihood:
      from: "role"
    confidence: 1.0
    group_by: ["session_id", "kind", "id"]
    references: ["RFC 7296 §3.3.2", "RFC 8247 §2.2"]
    recommendation_id: "REC-CRY-INT-002"
    plain_summary: "Packets are encrypted without any integrity protection algorithm enabled."
    plain_impact: "Active attackers can tamper with encrypted packets in flight without the receiver detecting changes."
    plain_fix: "Enable an authenticated encryption cipher like AES-GCM or add a SHA-2 HMAC transform."
    params: {}

  # ── IKE-V1-001: Deprecated IKEv1 protocol in use ────────────────────────────
  - id: "IKE-V1-001"
    target: "session"
    category: "Protocol"
    title: "Deprecated IKEv1 protocol in use"
    explanation: "IKEv1 is deprecated (RFC 9395) due to architectural vulnerabilities and lack of modern cryptographic agility."
    why_this_matters: "IKEv1 lacks protection against quantum attacks, has weaker identity protection, and does not support modern authenticated ciphers."
    condition:
      all:
        - field: "version"
          op: "eq"
          value: 1
    impact: 2
    likelihood: 5
    confidence: 1.0
    group_by: ["id"]
    references: ["RFC 9395", "NIST SP 800-77 Rev. 1"]
    recommendation_id: "REC-IKEV2"
    plain_summary: "The connection relies on the deprecated IKEv1 protocol."
    plain_impact: "IKEv1 lacks modern cryptographic protections, negotiates slower, and cannot protect against quantum threats."
    plain_fix: "Upgrade VPN gateway configurations to IKEv2 per RFC 7296."
    params: {}

  # ── IKE-V1-002: Aggressive Mode used ────────────────────────────────────────
  - id: "IKE-V1-002"
    target: "session"
    category: "Protocol"
    title: "IKEv1 Aggressive Mode in use"
    explanation: "IKEv1 Aggressive Mode exchange transmits identities without identity protection."
    why_this_matters: "An eavesdropper can passively capture peer identities and target them for offline authentication attacks."
    condition:
      all:
        - field: "version"
          op: "eq"
          value: 1
        - field: "aggressive_mode"
          op: "eq"
          value: true
    impact: 3
    likelihood: 5
    confidence: 1.0
    group_by: ["id"]
    references: ["RFC 2409 §5.4", "NIST SP 800-77 Rev. 1 §4.1"]
    recommendation_id: "REC-NO-AGGR"
    plain_summary: "The connection uses IKEv1 Aggressive Mode."
    plain_impact: "Device identities are sent across the public internet without encryption, exposing who is connecting."
    plain_fix: "Switch to IKEv1 Main Mode or migrate to IKEv2."
    params: {}

  # ── IKE-V1-003: Aggressive Mode with PSK exposes hash ───────────────────────
  - id: "IKE-V1-003"
    target: "session"
    category: "Protocol"
    title: "IKEv1 Aggressive Mode with PSK exposes authentication hash"
    explanation: "Aggressive Mode transmits the peer identity and a hash derived from the pre-shared key unencrypted in the cleartext reply."
    why_this_matters: "An adversary capturing this traffic can perform an offline dictionary or brute-force attack to recover the pre-shared key."
    condition:
      all:
        - field: "version"
          op: "eq"
          value: 1
        - field: "aggressive_mode"
          op: "eq"
          value: true
        - field: "has_psk"
          op: "eq"
          value: true
        - field: "has_cleartext_hash"
          op: "eq"
          value: true
    impact: 4
    likelihood: 5
    confidence: 1.0
    group_by: ["id"]
    references: ["RFC 2409", "NIST SP 800-77 Rev. 1"]
    mitre: ["T1110.002"]
    recommendation_id: "REC-NO-AGGR"
    plain_summary: "IKEv1 Aggressive Mode transmits authentication hashes unencrypted."
    plain_impact: "Anyone recording network traffic can run password cracking tools offline to steal the pre-shared key."
    plain_fix: "Disable Aggressive Mode immediately and rotate the pre-shared key."
    params: {}

  # ── IKE-V1-004: Excessive IKEv1 SA lifetime ─────────────────────────────────
  - id: "IKE-V1-004"
    target: "observation"
    category: "Configuration"
    title: "Excessive IKEv1 SA lifetime ({id}s)"
    explanation: "Configured SA lifetime of {id} seconds exceeds the recommended maximum of 86400s (24 hours)."
    why_this_matters: "Long lifetimes increase the window of vulnerability if session keys are compromised."
    condition:
      all:
        - field: "kind"
          op: "eq"
          value: "lifetime"
        - field: "id"
          op: "gt"
          value: 86400
    impact: 2
    likelihood: 5
    confidence: 1.0
    group_by: ["session_id", "kind"]
    references: ["NIST SP 800-77 Rev. 1"]
    recommendation_id: "REC-LIFETIME"
    plain_summary: "The configured Security Association lifetime is unusually long."
    plain_impact: "Using the same encryption key for too long gives attackers more time to compromise the key."
    plain_fix: "Limit IKE SA lifetimes to a maximum of 24 hours (86400 seconds)."
    params:
      max_lifetime_seconds: 86400

  # ── IKE-V1-005: IKEv1 PSK authentication in use ─────────────────────────────
  - id: "IKE-V1-005"
    target: "observation"
    category: "Authentication"
    title: "IKEv1 pre-shared key (PSK) authentication in use"
    explanation: "IKEv1 session uses pre-shared keys for authentication. Pre-shared keys are prone to weak passphrases and reuse."
    why_this_matters: "PSK authentication is vulnerable to brute-force attacks and management scaling weaknesses."
    condition:
      all:
        - field: "kind"
          op: "eq"
          value: "auth_method"
        - field: "id"
          op: "eq"
          value: 1
        - field: "role"
          op: "eq"
          value: "selected"
    impact: 1
    likelihood: 5
    confidence: 1.0
    group_by: ["session_id", "kind", "id"]
    references: ["NIST SP 800-77 Rev. 1 §4.1"]
    recommendation_id: "REC-CERT-AUTH"
    plain_summary: "The VPN uses a pre-shared password for gateway authentication."
    plain_impact: "Shared passwords can be leaked, guessed, or reused across multiple unauthorized devices."
    plain_fix: "Transition from pre-shared passwords to digital PKI certificates (RSA or ECDSA)."
    params: {}

  # ── IKE-PROTO-001: Malformed IKE messages ───────────────────────────────────
  - id: "IKE-PROTO-001"
    target: "session"
    category: "Protocol"
    title: "Malformed IKE messages or protocol anomalies detected"
    explanation: "Parser encountered malformed packets, length inconsistencies, or unexpected payload structures in IKE session."
    why_this_matters: "Malformed messages can indicate fuzzing, protocol downgrade attacks, or implementation bugs."
    condition:
      all:
        - field: "has_anomalies"
          op: "eq"
          value: true
    impact: 2
    likelihood: 3
    confidence: 0.9
    group_by: ["id"]
    references: ["RFC 7296", "RFC 2409"]
    recommendation_id: "REC-INVESTIGATE-PEER"
    plain_summary: "Malformed or anomalous IKE protocol messages were detected in the traffic."
    plain_impact: "Can indicate active network probing, protocol fuzzing, or severe firewall firmware incompatibilities."
    plain_fix: "Investigate firewall error logs and verify firmware compatibility between peers."
    params: {}

  # ── IKE-PROTO-002: Key Exchange length mismatch ─────────────────────────────
  - id: "IKE-PROTO-002"
    target: "session"
    category: "Protocol"
    title: "Key Exchange (KE) payload length inconsistent with DH group"
    explanation: "The observed Key Exchange payload length does not match the expected length defined for the negotiated DH group."
    why_this_matters: "KE length discrepancies may indicate invalid public keys, potential small-subgroup attacks, or parser exploitation."
    condition:
      all:
        - field: "ke_mismatch"
          op: "eq"
          value: true
    impact: 3
    likelihood: 4
    confidence: 0.9
    group_by: ["id"]
    references: ["RFC 7296 §3.4", "RFC 8247"]
    recommendation_id: "REC-INVESTIGATE-PEER"
    plain_summary: "The Key Exchange payload length does not match the chosen Diffie-Hellman group."
    plain_impact: "Mismatched key lengths can lead to connection failures or small-subgroup cryptographic attacks."
    plain_fix: "Ensure peer implementations agree on standard public key exchange lengths."
    params: {}

  # ── IKE-INFO-001: Peer implementation fingerprint ───────────────────────────
  - id: "IKE-INFO-001"
    target: "session"
    category: "Information"
    title: "Peer implementation fingerprint identified"
    explanation: "Vendor ID payloads observed in IKE negotiation indicate peer software implementation."
    why_this_matters: "Informational finding for asset inventory and patch hygiene tracking."
    condition:
      all:
        - field: "has_vendor_ids"
          op: "eq"
          value: true
    impact: 1
    likelihood: 5
    confidence: 0.8
    override_severity: "Info"
    group_by: ["id"]
    references: ["RFC 7296 §3.12", "RFC 2408 §3.13"]
    recommendation_id: "REC-PATCH-HYGIENE"
    plain_summary: "The VPN gateway revealed its software brand and version in handshake headers."
    plain_impact: "Informational finding; helps network administrators track device models but assists attackers in targeted exploits."
    plain_fix: "Ensure gateway software is patched with the latest manufacturer firmware updates."
    params: {}

  # ── IKE-INFO-002: NAT-Traversal in use ──────────────────────────────────────
  - id: "IKE-INFO-002"
    target: "session"
    category: "Information"
    title: "NAT-Traversal (NAT-T) active on UDP 4500"
    explanation: "IKE and/or ESP encapsulation over UDP port 4500 detected, indicating NAT in the path."
    why_this_matters: "Informational finding confirming NAT-T traversal operational status."
    condition:
      all:
        - field: "natt"
          op: "eq"
          value: true
    impact: 1
    likelihood: 5
    confidence: 0.9
    override_severity: "Info"
    group_by: ["id"]
    references: ["RFC 3947", "RFC 3948"]
    plain_summary: "The VPN is using NAT Traversal over UDP port 4500 to cross an intermediate router."
    plain_impact: "Informational finding confirming normal network address translation operation."
    plain_fix: "No remediation required; NAT Traversal is working as intended."
    params: {}

