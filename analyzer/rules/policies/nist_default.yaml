policy_id: "nist_default"
version: "1.0"
description: "NIST SP 800-77 Rev. 1 baseline IPsec security policy"

tables:
  dh_impact:
    "1": 5     # MODP-768: Broken
    "2": 4     # MODP-1024: Weak
    "5": 3     # MODP-1536: Legacy
    "14": 1    # MODP-2048: Acceptable
    "19": 1    # ECP-256: Strong
    "20": 1    # ECP-384: Strong
    "21": 1    # ECP-521: Strong
    "31": 1    # Curve25519: Strong
  encr_impact:
    "1": 5     # DES-IV64: Broken
    "2": 5     # DES: Broken
    "3": 3     # 3DES: Deprecated
    "11": 5    # NULL: Plaintext
    "12": 1    # AES-CBC
    "18": 1    # AES-GCM-8
    "19": 1    # AES-GCM-12
    "20": 1    # AES-GCM-16
    "28": 1    # ChaCha20-Poly1305
  integ_impact:
    "0": 5     # NONE
    "1": 4     # HMAC-MD5-96: Weak
    "2": 2     # HMAC-SHA1-96: Deprecated
    "12": 1    # HMAC-SHA2-256-128: Acceptable

rules:
  - id: "CRY-DH-001"
    target: "observation"
    category: "Cryptography"
    title: "Weak or broken Diffie-Hellman group {name} (group {id})"
    explanation: "Diffie-Hellman group {name} ({id}) provides insufficient key exchange security."
    why_this_matters: "Attackers can solve discrete logarithms for small groups, breaking forward secrecy."
    condition:
      all:
        - field: "kind"
          op: "eq"
          value: "dh"
        - field: "id"
          op: "in"
          value: [1, 2, 5, 22, 23, 24]
    impact:
      table: "dh_impact"
      default: 3
    likelihood:
      from: "role"
    confidence: 1.0
    group_by: ["session_id", "kind", "id"]
    references: ["NIST SP 800-77 Rev. 1", "RFC 8247 §2.4"]
    mitre: ["T1600.001"]
    recommendation_id: "REC-CRY-DH-001"
    params:
      threshold_bits: 2048
